name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test
      - name: Packaged plugin-shell smoke (pack → fresh host → load → register → real plugin_check call)
        run: pnpm test:integration
      - name: CLI smoke (help + manifest check against a real plugin)
        run: |
          node lib/bin.js --help >/dev/null
          node lib/bin.js tests/fixtures/good-plugin | grep -q '\[PASS\] manifest'
          node lib/bin.js tests/fixtures/good-plugin | grep -q '\[PASS\] patch'
      - name: Profile shadow tripwire smoke
        run: |
          node lib/bin.js --profile tests/fixtures/good-plugin | grep -q '\[PASS\] profile-shadow'
          node lib/bin.js --profile tests/fixtures/good-plugin --json | grep -q '"ok": true'
      - name: Environment diagnostics smoke
        run: |
          node lib/bin.js --env | grep -q 'ENVIRONMENT'
          node lib/bin.js --env --json | grep -q '"ok":'
          node lib/bin.js --env --port 31234 --json | grep -q '"port-31234"'
      - name: Full doctor self-check (pack → fresh DSH_HOME profile → dsh plugin add → dump-config)
        run: node lib/bin.js --full .
